[package]
name = "carbon"
version = "0.13.11"
edition = "2021"
license = "Apache-2.0"
description = "Run and manage Carbon sessions from the command line."
repository = "https://github.com/matthieu-pm/carbonhq"

[[bin]]
name = "carbon"
path = "src/main.rs"

[dependencies]
carbon-proto = { path = "../../crates/carbon-proto" }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
serde_json = "1"
base64 = "0.23"
uuid = { version = "1.16", features = ["v4"] }
qrcode = { version = "0.14.1", default-features = false }

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1

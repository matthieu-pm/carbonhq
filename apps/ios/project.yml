name: Carbon
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: 7WYP3LRDL8
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
packages:
  ThinkingOrbs:
    url: https://github.com/yogesharc/thinking-orbs
    revision: 78760661f652ffb1fa1955cd7ea41657fb7beae7
targets:
  Carbon:
    type: application
    platform: iOS
    sources:
      - Carbon
      # The Island's dictation orb, shared by path as the Island shares this app's client.
      - path: ../island/Island/VoiceOrb.swift
      - path: ../island/Island/VoiceOrb.metal
    dependencies:
      - package: ThinkingOrbs
    scheme:
      testTargets: [CarbonTests, CarbonUITests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yogesh.carbon.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        # The `carbon://` scheme a pairing QR opens, which no INFOPLIST_KEY can say.
        INFOPLIST_FILE: Carbon/Info.plist
        INFOPLIST_KEY_NSCameraUsageDescription: Carbon scans the QR code a Mac or server shows, to add it.
        INFOPLIST_KEY_CFBundleDisplayName: Carbon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Carbon records your dictation and sends it to your Mac, which turns it into text.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        # Only HTTPS and standard crypto, so TestFlight asks nothing about export.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
  CarbonTests:
    type: bundle.unit-test
    platform: iOS
    sources: [CarbonTests]
    dependencies:
      - target: Carbon
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yogesh.carbon.ios.tests
        GENERATE_INFOPLIST_FILE: YES
  CarbonUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [CarbonUITests]
    dependencies:
      - target: Carbon
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yogesh.carbon.ios.uitests
        GENERATE_INFOPLIST_FILE: YES

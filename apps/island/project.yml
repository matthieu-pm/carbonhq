name: CarbonIsland
options:
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: 7WYP3LRDL8
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
packages:
  ThinkingOrbs:
    url: https://github.com/yogesharc/thinking-orbs
    from: 0.1.2
targets:
  CarbonIsland:
    type: application
    platform: macOS
    dependencies:
      - package: ThinkingOrbs
    sources:
      - Island
      # The iOS app's client of carbon-serve, shared by path rather than by package.
      - path: ../ios/Carbon/Wire.swift
      - path: ../ios/Carbon/Connection.swift
      - path: ../ios/Carbon/Store.swift
      - path: ../ios/Carbon/Transcript.swift
      - path: ../ios/Carbon/Markdown.swift
      - path: ../ios/Carbon/Images.swift
      - path: ../ios/Carbon/Tools.swift
      - path: ../ios/Carbon/Picks.swift
      - path: ../ios/Carbon/Sidebar.swift
      - path: ../ios/Carbon/Pr.swift
      - path: ../ios/Carbon/PrGlyph.swift
      - path: ../ios/Carbon/Shimmer.swift
      - path: ../desktop/src/assets/dictate-start.wav
        buildPhase: resources
      - path: ../desktop/src/assets/dictate-stop.wav
        buildPhase: resources
      - path: ../desktop/public/notification.wav
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: Carbon Island
        PRODUCT_BUNDLE_IDENTIFIER: com.yogesh.carbon.island
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_CFBundleDisplayName: Carbon Island
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        # A local WebSocket to This Mac's server, and nothing sandboxed can reach ~/.carbon.
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
  # The island itself, every state it can be in, on seeded sessions with no
  # server behind them. Kept, so the question can be looked at again.
  IslandStatusDemo:
    type: application
    platform: macOS
    dependencies:
      - package: ThinkingOrbs
    sources:
      - Demo
      - Island
      - path: ../ios/Carbon/Wire.swift
      - path: ../ios/Carbon/Connection.swift
      - path: ../ios/Carbon/Store.swift
      - path: ../ios/Carbon/Transcript.swift
      - path: ../ios/Carbon/Markdown.swift
      - path: ../ios/Carbon/Images.swift
      - path: ../ios/Carbon/Tools.swift
      - path: ../ios/Carbon/Picks.swift
      - path: ../ios/Carbon/Sidebar.swift
      - path: ../ios/Carbon/Pr.swift
      - path: ../ios/Carbon/PrGlyph.swift
      - path: ../ios/Carbon/Shimmer.swift
    settings:
      base:
        PRODUCT_NAME: Island Status Demo
        PRODUCT_BUNDLE_IDENTIFIER: com.yogesh.carbon.island.statusdemo
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_APP_SANDBOX: NO
        # Leaves out the island's own `@main`, and lets the demo seed a Store.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) ISLAND_DEMO
  # A demo, kept: every candidate dictation orb side by side, live (#568).
  OrbLab:
    type: application
    platform: macOS
    sources:
      - Lab
      - path: Island/VoiceOrb.swift
      - path: Island/VoiceOrb.metal
    settings:
      base:
        PRODUCT_NAME: OrbLab
        PRODUCT_BUNDLE_IDENTIFIER: com.yogesh.carbon.orblab
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Orb Lab
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Orb Lab can drive the orbs from your microphone.
        ENABLE_APP_SANDBOX: NO

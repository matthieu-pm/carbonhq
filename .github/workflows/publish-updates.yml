name: Publish update manifests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: updates
          persist-credentials: false

      - name: Validate and stage manifests
        shell: bash
        run: |
          set -euo pipefail
          mkdir pages
          found=0
          for channel in beta stable; do
            file="$channel.json"
            [ -f "$file" ] || continue
            jq -e '
              (.version | type == "string" and test("^[0-9]+\\.[0-9]+\\.[0-9]+(-[0-9A-Za-z.-]+)?$")) and
              (.platforms | [.["darwin-aarch64"], .["darwin-x86_64"]] |
                all((.url | type == "string" and startswith("https://")) and
                    (.signature | type == "string" and length > 0)))
            ' "$file" >/dev/null
            cp "$file" pages/
            found=1
          done
          [ "$found" = 1 ]

      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: pages

      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
